name: Build StandoffCheat IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ipa:
        description: 'IPA source. Options: "release" (grab latest .ipa from Releases) or a direct https URL.'
        required: false
        default: 'release'
      sign:
        description: 'codesign identity for the macOS build (default: ad-hoc "-")'
        required: false
        default: '-'
      mode:
        description: 'Injection strategy. "shell" = hide cheat inside an existing framework (anti-ban). "inject" = classic injected dylib.'
        required: false
        default: 'shell'
      target:
        description: 'Framework to shell (mode=shell). Default: AppMetricaLog'
        required: false
        default: 'AppMetricaLog'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app || true
          echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> $GITHUB_ENV
          xcrun --sdk iphoneos --show-sdk-path || true

      - name: Build insert_dylib
        run: |
          git clone --depth 1 https://github.com/Tyilo/insert_dylib /tmp/insert_dylib
          mkdir -p /tmp/insert_dylib/bin
          clang -O2 /tmp/insert_dylib/insert_dylib/main.c -o /tmp/insert_dylib/bin/insert_dylib
          echo "/tmp/insert_dylib/bin" >> "$GITHUB_PATH"

      - name: Build dylib
        run: bash -x build.sh

      - name: Obtain IPA
        id: ipa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INPUT="${{ github.event.inputs.ipa }}"
          case "$INPUT" in
            ""|release)
              ASSET_URL="$(gh release view --repo "${{ github.repository }}" --json assets --jq '.assets[] | select(.name | contains(".ipa")) | .url' | head -1)"
              [ -n "$ASSET_URL" ] || { echo "::error::No .ipa asset found in latest release. Upload the IPA as a release asset."; exit 1; }
              echo "Downloading release asset: $ASSET_URL"
              gh release download --repo "${{ github.repository }}" --pattern '*.ipa' --clobber
              ;;
            http*)
              echo "Downloading IPA from URL"
              curl -fL --retry 3 -o source.ipa "$INPUT"
              ;;
            *)
              echo "::error::Could not parse ipa input: $INPUT"; exit 1
              ;;
          esac
          IPA_FILE="$(ls *.ipa | head -1)"
          echo "IPA copy present: $IPA_FILE"
          echo "ipa_file=$IPA_FILE" >> "$GITHUB_OUTPUT"

      - name: List frameworks in IPA (diagnostic)
        run: |
          unzip -l "${{ steps.ipa.outputs.ipa_file }}" | grep -E '\.framework/[^/]+$' | awk '{print $4}' | sed 's#.*/##' | sort | uniq -c

      - name: Build Inject IPA (Direct dylib injection — safest)
        run: |
          mkdir -p output
          bash -x inject.sh "${{ steps.ipa.outputs.ipa_file }}" "output/Standoff2-cheat-inject.ipa"
        env:
          CODE_SIGN_IDENTITY: "${{ github.event.inputs.sign || '-' }}"

      - name: Build Shellswap IPA (Hidden inside framework)
        run: |
          mkdir -p output
          bash -x shellswap.sh "${{ steps.ipa.outputs.ipa_file }}" "AppMetricaLog" "output/Standoff2-cheat-shell.ipa"
        env:
          CODE_SIGN_IDENTITY: "${{ github.event.inputs.sign || '-' }}"

      - name: Upload standalone dylib (lightweight)
        uses: actions/upload-artifact@v4
        with:
          name: libgamedata-dylib
          path: build/libgamedata.dylib
          retention-days: 7
          if-no-files-found: error

      - name: Upload Inject IPA
        uses: actions/upload-artifact@v4
        with:
          name: Standoff2-cheat-inject-ipa
          path: output/Standoff2-cheat-inject.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Upload Shellswap IPA
        uses: actions/upload-artifact@v4
        with:
          name: Standoff2-cheat-shell-ipa
          path: output/Standoff2-cheat-shell.ipa
          retention-days: 7
          if-no-files-found: error